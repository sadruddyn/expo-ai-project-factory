<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 484" width="980" height="484" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Expo AI Project Factory works</title>
  <desc id="d">Four steps. One: you install once. Two: you give a project name and a brief. Three: the agent writes a plan and lists its assumptions without changing files. Four: you approve and the agent builds one phase at a time, then offers to remember your stack.</desc>

  <rect width="980" height="484" rx="16" fill="#0f172a"/>

  <text x="490" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">From a short brief to an approved Expo plan</text>
  <text x="490" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">You describe the app. The agent plans it. Nothing is built until you approve.</text>

  <!-- arrows between cards -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M231 242 H257 M250 235 l7 7 l-7 7"/>
    <path d="M476 242 H502 M495 235 l7 7 l-7 7"/>
    <path d="M721 242 H747 M740 235 l7 7 l-7 7"/>
  </g>

  <!-- Card 1 -->
  <g transform="translate(20,100)">
    <rect width="205" height="284" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="30" cy="32" r="15" fill="#38bdf8"/>
    <text x="30" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1</text>
    <rect x="142" y="21" width="49" height="22" rx="11" fill="#0c4a6e"/>
    <text x="166.500" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#7dd3fc">YOU</text>
    <text x="16" y="78" font-size="16" font-weight="700" fill="#f8fafc">Install once</text>
    <rect x="14" y="94" width="177" height="34" rx="6" fill="#0f172a"/>
    <text x="24" y="116" font-size="12" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./scripts/install.sh</text>
    <g font-size="13" fill="#cbd5e1">
      <text x="16" y="156">Links the skill into</text>
      <text x="16" y="175">Claude Code and Codex.</text>
      <text x="16" y="205">Asks one question:</text>
      <text x="16" y="224">your usual backend.</text>
    </g>
    <text x="16" y="252" font-size="12" fill="#64748b">No file to edit.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(265,100)">
    <rect width="205" height="284" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="30" cy="32" r="15" fill="#38bdf8"/>
    <text x="30" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2</text>
    <rect x="142" y="21" width="49" height="22" rx="11" fill="#0c4a6e"/>
    <text x="166.500" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#7dd3fc">YOU</text>
    <text x="16" y="78" font-size="16" font-weight="700" fill="#f8fafc">Name + brief</text>
    <rect x="14" y="94" width="177" height="122" rx="6" fill="#0f172a"/>
    <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="24" y="116" fill="#a7f3d0">./new-project.sh</text>
      <text x="24" y="140" fill="#94a3b8">Project name:</text>
      <text x="24" y="158" fill="#f8fafc">Salon Booking</text>
      <text x="24" y="182" fill="#94a3b8">&gt; <tspan fill="#f8fafc">Customers book</tspan></text>
      <text x="24" y="200" fill="#f8fafc">  nearby salons...</text>
    </g>
    <g font-size="13" fill="#cbd5e1">
      <text x="16" y="240">Two answers. Nothing</text>
      <text x="16" y="259">about stack or tools.</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(510,100)">
    <rect width="205" height="284" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="30" cy="32" r="15" fill="#c084fc"/>
    <text x="30" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3</text>
    <rect x="130" y="21" width="61" height="22" rx="11" fill="#4c1d95"/>
    <text x="160.500" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#d8b4fe">AGENT</text>
    <text x="16" y="78" font-size="16" font-weight="700" fill="#f8fafc">Writes a plan</text>
    <g font-size="13" fill="#cbd5e1">
      <circle cx="21" cy="104" r="3" fill="#c084fc"/><text x="32" y="109">Picks the Expo skills</text>
      <circle cx="21" cy="130" r="3" fill="#c084fc"/><text x="32" y="135">Architecture, screens</text>
      <circle cx="21" cy="156" r="3" fill="#c084fc"/><text x="32" y="161">Dependencies, phases</text>
      <circle cx="21" cy="182" r="3" fill="#c084fc"/><text x="32" y="187">Lists every assumption</text>
    </g>
    <rect x="14" y="212" width="177" height="40" rx="8" fill="#052e16" stroke="#166534"/>
    <text x="102.500" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#86efac">No files changed yet</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(755,100)">
    <rect width="205" height="284" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="30" cy="32" r="15" fill="#fbbf24"/>
    <text x="30" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4</text>
    <rect x="104" y="21" width="87" height="22" rx="11" fill="#713f12"/>
    <text x="147.500" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">YOU + AGENT</text>
    <text x="16" y="78" font-size="16" font-weight="700" fill="#f8fafc">Approve, then build</text>
    <rect x="14" y="94" width="177" height="34" rx="6" fill="#0f172a"/>
    <text x="22" y="116" font-size="11" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Approved. Phase 1 only.</text>
    <g font-size="13" fill="#cbd5e1">
      <circle cx="21" cy="152" r="3" fill="#fbbf24"/><text x="32" y="157">One phase at a time</text>
      <circle cx="21" cy="178" r="3" fill="#fbbf24"/><text x="32" y="183">Runs checks, reports</text>
      <circle cx="21" cy="204" r="3" fill="#fbbf24"/><text x="32" y="209">Offers to remember</text>
      <text x="32" y="228">your stack</text>
    </g>
  </g>

  <!-- footer -->
  <rect x="20" y="408" width="940" height="52" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="440" text-anchor="middle" font-size="15" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">Next project:</tspan> only steps 2 to 4. Your stack is already remembered.</text>
</svg>
